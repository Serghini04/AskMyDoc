[project]
name = "askmydoc-backend"
version = "1.0.0"
description = "AskMyDoc RAG API: ingest documents and answer questions grounded in them."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # modern syntax for the target Python
    "SIM",      # simplifications
    "N",        # naming
    "RUF",      # ruff-specific
]
ignore = [
    "B008",     # FastAPI's Depends()/File() in defaults is the framework idiom
    "RUF001",   # typographic quotes in prompt text are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
