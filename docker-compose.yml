version: '3.8'

services:
  postgres:
    image: postgres:15-alpine 
    container_name: rag_postgres
    restart: unless-stopped
    env_file:
      - .env  # Injects your .env variables directly into the container
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333" # REST API and Web UI
      - "6334:6334"                 # gRPC port (faster for large scale data)
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: